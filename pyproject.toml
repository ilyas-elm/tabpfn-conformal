[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabpfn-conformal"
version = "0.1.0"
description = "Distribution-free coverage guarantees for tabular classifiers, built for TabPFN-3.5."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ilyas El Maazouzi", email = "ilyaselmaazouzi9@gmail.com" }]
keywords = ["conformal-prediction", "tabpfn", "uncertainty", "fraud-detection", "tabular"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core stays deliberately tiny: no torch, no tabpfn, no GPU. See docs/CAHIER-DES-CHARGES.md section 5.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Regenerating the figures must not require the TabPFN stack: a reader checking
# the results should never need an API key, a GPU, or lightgbm.
analysis = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.0",
    "mapie>=0.8",
    "matplotlib>=3.7",
    # scripts/verify_claims.py reads this file back; tomllib is 3.11+ and
    # requires-python still says 3.10.
    'tomli>=2.0; python_version < "3.11"',
]
experiments = ["tabpfn-client", "matplotlib>=3.7", "lightgbm", "pyarrow", "kagglehub"]

[project.urls]
Homepage = "https://github.com/ilyas-elm/tabpfn-conformal"
Issues = "https://github.com/ilyas-elm/tabpfn-conformal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tabpfn_conformal"]
# PEP 561: without this marker the package is fully annotated and type checkers
# still treat it as untyped, so downstream users get nothing from the hints.
artifacts = ["src/tabpfn_conformal/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
