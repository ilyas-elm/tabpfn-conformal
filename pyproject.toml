[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabpfn-conformal"
version = "0.1.0"
description = "Distribution-free coverage guarantees for tabular classifiers, built for TabPFN-3.5."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "TODO: your name", email = "TODO@example.com" }]
keywords = ["conformal-prediction", "tabpfn", "uncertainty", "fraud-detection", "tabular"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core stays deliberately tiny: no torch, no tabpfn, no GPU. See docs/CAHIER-DES-CHARGES.md section 5.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mapie>=0.8"]
experiments = ["tabpfn-client", "matplotlib", "lightgbm", "pyarrow"]

[project.urls]
Homepage = "https://github.com/TODO/tabpfn-conformal"

[tool.hatch.build.targets.wheel]
packages = ["src/tabpfn_conformal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
