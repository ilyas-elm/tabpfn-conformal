name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        # CPU only, no GPU, no TabPFN: the core package must stay this light.
        run: pytest -q

      - name: Scan for anything credential-shaped
        # This repository is public and its experiments are API-backed, so the
        # failure mode is a token pasted into a script or a log captured
        # verbatim from a response. Neither looks like a mistake at the time.
        run: python scripts/check_secrets.py

      - name: Verify every numeric claim in the README
        # The signature check of this project: recomputes each figure in the
        # README from results/ and exits non-zero on any drift. Needs no API
        # key and no dataset -- it reads committed results only.
        run: python scripts/verify_claims.py

      - name: Check the extensions payload still matches src/
        run: |
          python scripts/build_extension_pr.py
          git diff --exit-code contrib/

      - name: Run the extensions payload's own tests
        env:
          FAST_TEST_MODE: "1"
          PYTHONPATH: contrib/tabpfn-extensions/src
        run: pytest -q contrib/tabpfn-extensions/tests
